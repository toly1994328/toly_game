flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/cover/
    - assets/data/
  fonts:
    - family: TolyGameIcon
      fonts:
        - asset: assets/iconfont/toly_game_icon.ttf
    - family: 'JetBrainsMono'
      fonts:
        - asset: 'assets/fonts/JetBrainsMono-VariableFont_wght.ttf'

