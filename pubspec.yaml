name: toly_game
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:   # 国际化
    sdk: flutter
  flutter_bloc: 8.1.6
  flame: ^1.26.0
  flame_audio: ^2.11.1
  shared_preferences: ^2.5.2
  cupertino_icons: ^1.0.2
  flame_svg: ^1.11.7
  flame_forge2d: ^0.14.0
  flutter_svg: ^2.0.17
  window_manager: ^0.4.3      # 桌面管理

  flame_ext:
    path: packages/flame_ext
