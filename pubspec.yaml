  intl: ^0.19.0
  oktoast: ^3.4.0

  tolyui: 0.0.4+8
  fx_framework: 0.0.1

  url_launcher: ^6.3.1 # url 跳转

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

